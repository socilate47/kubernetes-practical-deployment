apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: biasharaos-sqlite-pvc
  namespace: biasharaos
  labels:
    app.kubernetes.io/name: biasharaos
    app.kubernetes.io/component: sqlite-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: biasharaos-local
  resources:
    requests:
      storage: 2Gi
  # Pinning volumeName so we only ever bind to our PV and not a dynamically
  # provisioned one that happens to be lying around.
  volumeName: biasharaos-sqlite-pv
