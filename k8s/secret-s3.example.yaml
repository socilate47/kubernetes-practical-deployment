# TEMPLATE ONLY. Do NOT apply this file as-is to a real cluster, and never
# commit the real values. Create the live Secret with scripts/create-secrets.sh
# which reads from a local .env (git-ignored). This file documents the shape.
apiVersion: v1
kind: Secret
metadata:
  name: biasharaos-s3
  namespace: biasharaos
type: Opaque
stringData:
  # Credentials for the dedicated MinIO service account biasharaos-app
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # MinIO is S3-compatible; this region label is just required by the SDK.
  AWS_REGION: "us-east-1"
  # The MinIO LXC in the homelab (s3bucket on VLAN 30).
  S3_ENDPOINT: "http://192.168.30.147:9000"
  S3_BUCKET: "biasharaos-uploads"
  # MinIO requires path-style; virtual-hosted style breaks without DNS wildcards.
  S3_FORCE_PATH_STYLE: "true"
