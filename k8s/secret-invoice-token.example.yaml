# TEMPLATE ONLY — see secret-s3.example.yaml.
# scripts/create-secrets.sh generates a fresh hex-32 token if INVOICE_UPLOAD_TOKEN
# is empty in .env, so the only time you edit this file is to pin a specific token.
apiVersion: v1
kind: Secret
metadata:
  name: biasharaos-invoice-token
  namespace: biasharaos
type: Opaque
stringData:
  # Authenticates POST /api/invoices/upload via the x-upload-token header.
  # The app does a constant-time compare, so leading/trailing whitespace matters.
  INVOICE_UPLOAD_TOKEN: "REPLACE_ME_WITH_openssl_rand_hex_32"
